name: MiniMax Usage Monitor
version: 1.1.0
description: Shows MiniMax Coding Plan consumption (prompts remaining, rolling window) with progress bars and reset times. The /coding_plan/remains endpoint now needs a session cookie from platform.minimax.io in addition to the API key.
author: StreamDeck UI Community
entry_point: minimax_usage_plugin.py
license: MIT

lifecycle_mode: always_running
can_switch_page: false

max_retries: 5
retry_delay: 30

variables:
  - name: api_key
    type: password
    description: "MiniMax Coding Plan API key (leave empty to auto-read from opencode auth.json)"
    required: false

  - name: group_id
    type: string
    description: "MiniMax Group ID (from platform.minimax.io/user-center/basic-information)"
    required: true

  - name: browser
    type: select
    description: "Auto-read the platform.minimax.io session cookie from a local browser instead of pasting it. Pick 'disabled' to use the pasted session_cookie."
    required: false
    default: ""
    choices:
      - {value: "",         label: "disabled (use pasted cookie)"}
      - {value: "auto",     label: "auto (firefox → brave → chrome → chromium)"}
      - {value: "firefox",  label: "Firefox"}
      - {value: "brave",    label: "Brave"}
      - {value: "chrome",   label: "Chrome"}
      - {value: "chromium", label: "Chromium"}

  - name: cookie_domain
    type: string
    description: "Cookie domain to look up in the browser store (default: platform.minimax.io)."
    required: false
    default: platform.minimax.io

  - name: session_cookie
    type: password
    description: "Session cookie from platform.minimax.io (DevTools → Application → Cookies). Required for direct mode — the /coding_plan/remains endpoint rejects the API key alone with 'cookie is missing'. Only used when 'browser' is empty."
    required: false

  - name: opencode_auth_path
    type: file_path
    description: "Path to opencode auth.json (default ~/.local/share/opencode/auth.json)"
    required: false

  - name: poll_interval
    type: int
    description: Polling interval in seconds
    required: false
    default: 300

  - name: show_models
    type: string
    description: "Comma-separated model name filter (e.g. 'M2.7,M2.5'). Partial match, case-insensitive. Empty = show all."
    required: false

  - name: display_mode
    type: string
    description: "Display mode: 'compact' shows filtered models, 'rotate' cycles between them"
    required: false
    default: compact

  - name: rotate_interval
    type: int
    description: Seconds between view rotation (only used in rotate mode)
    required: false
    default: 5

  - name: quota_sentinel_url
    type: url
    description: "Optional Quota Sentinel URL (e.g. http://localhost:7878). If set, fetches usage from Quota Sentinel instead of calling the API directly."
    required: false

icon: minimax_icon.png
